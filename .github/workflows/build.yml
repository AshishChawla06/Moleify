name: Build & Release Moleify

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release macOS App Bundle
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Swift & Metal Environment
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-path

      - name: Run Unit Tests
        run: |
          swift test

      - name: Build Moleify Release App Bundle
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Package App Bundle for Release
        run: |
          zip -r Moleify-macOS-arm64.zip Moleify.app README.md LICENSE

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moleify-macOS-arm64
          path: Moleify-macOS-arm64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Moleify-macOS-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
